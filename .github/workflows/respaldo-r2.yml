name: Respaldo en R2

# Respalda crear.chat en Cloudflare R2 (bucket crearchat-web, carpeta backups/production/)
# después de cada publicación en producción; también se puede lanzar a mano desde Actions.
# Conserva los últimos 30 respaldos. Ver scripts/respaldo-r2.sh.
on:
  deployment_status:
  workflow_dispatch:

concurrency:
  group: respaldo-r2
  cancel-in-progress: false

jobs:
  respaldo:
    if: github.event_name != 'deployment_status' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Armar, subir, verificar y rotar el respaldo
        run: bash scripts/respaldo-r2.sh
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: crearchat-web
